services:
  postgres:
    image: postgres:16
    container_name: tinvix-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tinvix_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tinvix_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: tinvix-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: tinvix-backend:latest
    restart: always
    deploy:
      replicas: 2
    environment:
      ADMIN_API_KEY: ${ADMIN_API_KEY:-tinvix_secret_admin_key_2026}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tinvix_db}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-products}
      MINIO_SECURE: "False"
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-/storage/products}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: tinvix-frontend:latest
    restart: always
    deploy:
      replicas: 2
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    depends_on:
      - backend

  bot:
    build:
      context: ./bot
      dockerfile: Dockerfile
    image: tinvix-bot:latest
    restart: always
    environment:
      BOT_TOKEN: ${BOT_TOKEN:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-tinvix_secret_admin_key_2026}
      BACKEND_URL: http://nginx:80
      MINI_APP_URL: ${MINI_APP_URL:-http://localhost}
      ADMIN_IDS: ${ADMIN_IDS:-}
      BOT_MODE: ${BOT_MODE:-polling}
      WEBHOOK_HOST: ${WEBHOOK_HOST:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-my-webhook-secret-token}
    depends_on:
      - nginx

  nginx:
    image: nginx:alpine
    container_name: tinvix-nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  minio_data:
