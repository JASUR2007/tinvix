events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    upstream backend_cluster {
        server backend:8000 max_fails=2 fail_timeout=5s;
    }

    upstream frontend_cluster {
        server frontend:3000 max_fails=2 fail_timeout=5s;
    }

    upstream bot_cluster {
        server bot:8080 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 50M;

        # Header for inspecting which upstream replica served the request
        add_header X-Handled-By $upstream_addr always;

        # Frontend Next.js app
        location / {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # Next.js static files
        location /_next/static/ {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # Backend FastAPI API
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "close";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # FastAPI Swagger docs
        location /docs {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        location /openapi.json {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # MinIO S3 storage access
        location /storage/ {
            rewrite ^/storage/(.*) /$1 break;
            proxy_pass http://minio:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Telegram Bot Webhook endpoint (when BOT_MODE=webhook)
        location /bot-webhook {
            proxy_pass http://bot_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "close";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }
    }
}
